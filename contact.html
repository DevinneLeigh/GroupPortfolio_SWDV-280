<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="assets/css/main.css">
</head>
<body>
    <custom-navbar></custom-navbar>
    <header-banner title="Get in Touch" text="Have questions or want to get in touch? Fill out the form below and we'll get back to you as soon as possible."></header-banner>
    <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">

          <div class="card shadow-sm">
            <div class="card-body p-4">

              <form id="contact-form" method="GET" enctype="text/plain">

                <div class="row g-3">

                  <div class="col-md-6">
                    <label for="name" class="form-label">Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      name="user_name"
                      required
                    >
                  </div>

                  <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="user_email"
                      required
                    >
                  </div>

                  <div class="col-12">
                    <label for="subject" class="form-label">Subject</label>
                    <input
                      type="text"
                      class="form-control"
                      id="subject"
                      name="subject"
                    >
                  </div>

                  <div class="col-12">
                    <label for="message" class="form-label">Message</label>
                    <textarea
                      class="form-control"
                      id="message"
                      name="message"
                      rows="5"
                      required
                    ></textarea>
                  </div>

                  <div class="col-12 text-end">
                    <button type="submit" class="submit-btn accent-btn">
                      Send Message
                    </button>                 
                  </div>
                  <span id="status" class="text-danger"></span>

                </div>

              </form>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

    <custom-footer></custom-footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="assets/js/custom-elements.js"></script>
    <script src="assets/js/contact.js"></script>
    <script src="assets/js/finisher-header.es5.min (2).js" type="text/javascript"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/header-banner.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
