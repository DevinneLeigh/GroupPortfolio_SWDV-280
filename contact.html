    <header>
      <h1>Contact</h1>
    </header>
    <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">

          <div class="text-center mb-4">
            <h2 class="fw-bold">Get in Touch</h2>
            <p class="text-muted">
              Questions, comments, or ideas? Send us a message below.
            </p>
          </div>

          <div class="card shadow-sm">
            <div class="card-body p-4">

              <form action="mailto:swdv280contact@gmail.com" method="GET" enctype="text/plain">

                <div class="row g-3">

                  <div class="col-md-6">
                    <label for="name" class="form-label">Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      name="Name"
                      required
                    >
                  </div>

                  <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="Email"
                      required
                    >
                  </div>

                  <div class="col-12">
                    <label for="subject" class="form-label">Subject</label>
                    <input
                      type="text"
                      class="form-control"
                      id="subject"
                      name="Subject"
                    >
                  </div>

                  <div class="col-12">
                    <label for="message" class="form-label">Message</label>
                    <textarea
                      class="form-control"
                      id="message"
                      name="Message"
                      rows="5"
                      required
                    ></textarea>
                  </div>

                  <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary px-4">
                      Send Message
                    </button>
                  </div>

                </div>

              </form>

            </div>
          </div>

        </div>
      </div>
    </div>
